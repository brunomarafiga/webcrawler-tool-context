[project]
name = "webcrawler-tool-context"
version = "0.1.0"
description = "Pipeline de extração do campo tool_context para a base HarmonIA/LumIA"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "google-genai>=1.16",
    "python-dotenv>=1.0",
    "tenacity>=8.0",
    "trafilatura>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
